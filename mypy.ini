[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
exclude = (^data/|^\.venv/)

[mypy-api.tests.*]
# Tests: still type-checked, but test functions need no annotations.
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True

[mypy-meta_sam_parser.*,edge_tts.*,imageio_ffmpeg.*,playwright.*,yaml.*]
ignore_missing_imports = True
