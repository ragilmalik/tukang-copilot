<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008069">
<title>Tukang Copilot on WhatsApp (simulator)</title>
<link rel="icon" href="/static/icons/icon-192.png">
<style>
  @font-face { font-family:"Barlow Condensed"; font-weight:800; font-display:swap; src:url(/static/fonts/barlow-condensed-800.woff2) format("woff2"); }
  @font-face { font-family:"Barlow"; font-weight:600; font-display:swap; src:url(/static/fonts/barlow-600.woff2) format("woff2"); }
  :root { --green:#008069; --bubble-me:#d9fdd3; --bg:#efeae2; --ink:#111b21; --muted:#54656f; --link:#027eb5; --btn:#00a884; --o:#FF6A13; --o-ledge:#B84A08; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#d1d7db; }
  .phone { max-width:480px; height:100%; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); }
  header { background:var(--green); color:#fff; display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--o); color:#1A1D21; display:grid; place-items:center; flex:none; box-shadow:inset 0 -3px 0 var(--o-ledge); }
  .avatar svg { width:22px; height:22px; }
  .who { flex:1; min-width:0; }
  .who b { display:block; font:800 20px/1.05 "Barlow Condensed", system-ui, sans-serif; letter-spacing:-.005em; }
  .who small { color:#fff; }
  .langs { display:flex; gap:2px; }
  .langs button { background:transparent; border:1px solid rgba(255,255,255,.5); color:#fff; border-radius:12px; padding:4px 8px; min-height:32px; font-size:12px; cursor:pointer; }
  .langs button[aria-pressed="true"] { background:#fff; color:var(--green); }
  .sim { background:#FFF5D6; color:#5c4400; font-size:13px; padding:7px 12px 7px 10px; border-left:4px solid #FFC21A; border-bottom:1px solid #ecd98a; }
  .sim b { display:block; font:600 14px/1.3 "Barlow", system-ui, sans-serif; }
  .sim a { color:#5c4400; }
  #log { flex:1; overflow-y:auto; padding:10px 10px 4px; }
  .day { text-align:center; margin:4px 0 10px; }
  .day span { background:#fff; color:var(--muted); font-size:12px; padding:4px 10px; border-radius:8px; box-shadow:0 1px .5px rgba(0,0,0,.13); }
  .hint { background:#fffc; color:var(--muted); text-align:center; font-size:13px; border-radius:8px; padding:8px 10px; margin:0 20px 10px; }
  .row { display:flex; margin:4px 0; }
  .row.me { justify-content:flex-end; }
  .msg { max-width:84%; background:#fff; border-radius:8px; padding:6px 8px 4px; box-shadow:0 1px .5px rgba(0,0,0,.13); word-wrap:break-word; white-space:pre-wrap; }
  .me .msg { background:var(--bubble-me); }
  .msg img { display:block; width:100%; max-width:280px; border-radius:6px; margin-bottom:4px; }
  .msg .time { display:block; text-align:right; font-size:11px; color:var(--muted); margin-top:2px; }
  .msg .foot { color:var(--muted); font-size:12px; margin-top:4px; }
  .msg a { color:var(--link); }
  .btns { display:flex; flex-direction:column; gap:3px; margin-top:3px; max-width:84%; }
  .btns button { background:#fff; border:0; border-radius:8px; color:var(--link); font:inherit; font-weight:600; padding:10px; min-height:44px; box-shadow:0 1px .5px rgba(0,0,0,.13); cursor:pointer; }
  .btns button:disabled { color:#9aa5ab; cursor:default; }
  .doc { display:flex; align-items:center; gap:10px; background:#f5f6f6; border-radius:6px; padding:10px; text-decoration:none; color:var(--ink); }
  .doc .ic { background:#e2574c; color:#fff; font-weight:700; font-size:11px; border-radius:4px; padding:8px 5px; }
  .doc small { color:var(--muted); display:block; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:6px 8px; background:var(--bg); }
  .chips button { flex:none; border:1px solid #c9d1d5; background:#fff; border-radius:16px; padding:6px 12px; min-height:36px; font:inherit; font-size:13px; cursor:pointer; }
  form { display:flex; align-items:flex-end; gap:6px; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); background:#f0f2f5; }
  .box { flex:1; display:flex; align-items:center; background:#fff; border-radius:22px; padding:0 6px; min-height:44px; }
  .box input[type=text] { flex:1; border:0; outline:0; font:inherit; padding:10px 6px; background:transparent; min-width:0; }
  .icon { border:0; background:transparent; font-size:20px; width:40px; height:40px; border-radius:50%; cursor:pointer; display:grid; place-items:center; }
  .send { background:var(--btn); color:#fff; width:46px; height:46px; flex:none; }
  .send.rec { background:#e2574c; }
  label.icon input { display:none; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  :focus-visible { outline:3px solid #1f6feb; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<main class="phone">
  <h1 class="sr-only">Tukang Copilot on WhatsApp (simulator)</h1>
  <header>
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg></div>
    <div class="who"><b>Tukang Copilot</b><small id="status">online</small></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="id" aria-pressed="false">ID</button>
      <button type="button" data-lang="jv" aria-pressed="false">JV</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <div class="sim" role="note"><b id="simLabel">Simulator, runs the same engine on offline sample answers</b><span id="simSub"></span></div>
  <section id="log" role="log" aria-live="polite" aria-label="Chat"><div class="day"><span id="today">Today</span></div><p class="hint" id="hint"></p></section>
  <div class="chips" id="chips" aria-label="Samples"></div>
  <form id="form" autocomplete="off">
    <div class="box">
      <label class="icon" title="Photo" id="photoLbl"><span aria-hidden="true">📷</span><span class="sr-only" id="photoSr">Send a photo</span><input id="file" type="file" accept="image/*" capture="environment"></label>
      <input id="text" type="text" maxlength="2000" aria-label="Message">
    </div>
    <button class="icon send" id="sendBtn" type="submit" aria-label="Send">➤</button>
  </form>
</main>
<script src="/static/wa.js"></script>
</body>
</html>
