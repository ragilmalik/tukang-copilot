line-length = 160
target-version = "py311"
[lint]
select = ["E", "F", "W"]
ignore = ["E701", "E702", "E741"]
[lint.per-file-ignores]
"api/pipeline/mock.py" = ["E501"]
"api/pipeline/safety.py" = ["E501"]
"api/testing/*" = ["E501"]
"scripts/*" = ["E501", "E402"]
"api/tests/*" = ["E501"]
"api/tests/test_playwright_replay.py" = ["E501", "F811"]  # re-uses the smoke test fixtures by import
"api/tests/test_playwright_audit5.py" = ["E501", "F811"]  # re-uses the smoke test fixtures by import
"api/tests/test_playwright_back.py" = ["E501", "F811"]  # re-uses the smoke test fixtures by import
"api/tests/test_playwright_lang.py" = ["E501", "F811"]  # re-uses the smoke test fixtures by import
"api/tests/test_playwright_steps.py" = ["E501", "F811"]  # re-uses the smoke test fixtures by import
"api/tests/test_playwright_judge_qa.py" = ["E501", "F811"]  # re-uses the smoke test fixtures by import
